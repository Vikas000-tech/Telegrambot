name: Daily Motivation Message

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  send-message:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Message to both bots
        run: |
          CHAT_ID="8933321006"

          MESSAGES=(
            "Bhai, aaj bhi wahi mauka hai — plan follow kar, emotion nahi. Trade se pehle apna checklist dekh, dil 'no' bole to seedha skip kar de. Naam jaap kar, mann shaant rakh, bina jaldi ke aaj ka din nikaal."
            "Chalte candle pe kudna hai ya confirmation ka wait karna — yehi farak amateur aur professional trader mein hota hai. Aaj professional wale side pe reh."
            "Dard hoga, loss bhi hoga — har trader ka yehi rasta hai. Process pe bharosa rakh, result pe nahi. Naam jaap kar, ego chhod, seekhta reh."
            "Ek achi trade se zyada zaroori hai ek achi habit. Aaj bas apna rule follow kar, chahe result kuch bhi ho."
            "Confirmation ka wait karna kamzori nahi, discipline hai. Jo aaj sabar rakhega, wahi kal munafa dekhega."
            "Scaling mat kar, ek clean entry le. Jitna simple rakhega, utna hi control rahega apne upar."
            "Naam jaap ke saath din shuru kar — mann sthir hoga, decision saaf aayega. Bina shaant mann ke koi bhi trade mat le."
            "Overtrading sabse bada dushman hai — din mein 1-2 best setup hi kaafi hain, baaki sab noise hai."
            "Jo aaj apne plan pe tika rahega, wahi kal apne aap pe garv karega. Pehle decide, fir change nahi."
            "Har din ek naya mauka hai khud ko behtar banane ka. Na kal ki galti dohraana hai, na kal ki jeet pe rukna hai — aaj bas aaj pe focus kar."
            "Radhe Radhe se din shuru kar — jab mann bhatke, naam pakad le, wahi tera anchor hai. Aaj bina anchor ke ek bhi trade mat le."
            "Concentration teri sabse badi galti rahi hai — ek stock mein 90% laga ke tu apna hi rule tod chuka hai. Aaj 20-25% ki seema yaad rakh, chahe setup kitna bhi accha lage."
            "Spike dekh ke kudna asaan hai, confirmation ka wait karna kathin — lekin kathin raasta hi tera hai. Radha naam le, patience rakh."
            "Ek hi stock mein long aur short dono — ye setup nahi, confusion hai. Aaj clarity rakh: ek direction, ek plan, ek entry."
            "Jitni baar mann bhatke, utni baar naam jaap laut aa — trading mein bhi, jeevan mein bhi, yehi practice hai."
            "7 trade ek ghante mein — wo din yaad hai? Aaj slow chal, kyunki slow hi sustainable hai."
            "Har haar ke baad naya capital daalna solution nahi hai — pehle process theek kar, paisa baad mein aayega."
            "Radhe ka naam le, ahankar chhod — market tujhse bada hai, ise jeetne ki nahi, iske saath chalne ki koshish kar."
            "Aaj bhi wahi test hai: setup wait karega ya tu chase karega? Jawab tera character batayega."
            "Chhoti jeet bhi jeet hai — agar aaj plan follow kiya, checklist pura kiya, to aaj win hai, result kuch bhi ho. Radhe Radhe."
            "Arjuna bhi confuse tha, dara hua tha jung shuru hone se pehle — darr aana galat nahi, darr ke saamne kadam na uthana galat hai. Aaj apna confusion accept kar, lekin ruk mat."
            "Karmanye vadhikaraste, ma phaleshu kadachana — tera haq sirf karm mein hai, result mein nahi. Aaj apna setup follow kar, result Krishna pe chhod de."
            "Bina kaam kiye koi nahi reh sakta — sawaal ye nahi ki kaam karna hai ya nahi, sawaal ye hai ki kis niyat se karna hai. Aaj apna trade seva ki tarah kar, lalach ki tarah nahi."
            "Jo apne karm mein hi tyaag dekh le, wahi asli gyani hai — bina fal ki chah ke kiya gaya kaam hi sabse shuddh hota hai."
            "Sanyasi wo nahi jo kaam chhod de, sanyasi wo hai jo kaam karte hue bhi attach nahi hota. Trading chhodni nahi hai, bas result se chipakna chhodna hai."
            "Apna mann hi apna sabse bada dost hai ya sabse bada dushman — jo apne mann ko jeet le, uske liye mann dost ban jaata hai. Naam jaap se roz thoda mann sadha."
            "Hazaron mein koi ek hi asli siddhi ki taraf koshish karta hai — rare cheez asaan nahi hoti. Discipline bhi aisi hi rare cheez hai, isliye usse pakad ke rakh."
            "Jo insaan jis bhi cheez ka roz smaran karta hai, wahi uski aadat ban jaati hai. Naam jaap roz kar, mann ki disha set hoti hai."
            "Koi bhi Mujhe prem se ek patta, phool ya paani bhi arpan kare, Main use sweekar kar leta hoon — bhaav bada hota hai, size nahi. Chhota disciplined trade bhi, sahi niyat se liya, bada kaam hai."
            "Jo bhi shreshtha aur sundar hai duniya mein, wo sab Meri hi jhalak hai. Apne kaam mein bhi excellence dhoondh, wahi bhakti hai."
            "Arjuna ne Krishna ka vishwaroop dekha aur dar gaya, kyunki poori sachai ek saath dekhna aasan nahi. Market ki poori sachai bhi ek din mein nahi samajh aati — dheere dheere seekh."
            "Jo apna mann poori tarah Mujh mein laga deta hai, wahi sabse pyara bhakt hai. Naam jaap tera sabse seedha raasta hai, usse mat chhod."
            "Shareer ek kshetra hai, jo usse jaanta hai wo alag hai — khud ko sirf apne emotions samajh lega, wahi bhatkega. Apne emotions ko dekh, unmein kho mat."
            "Sattva, Rajas aur Tamas — ye teen gunas har insaan ko bandhte hain. Jab trade lalach se aaye, samajh ja galat waqt hai."
            "Ye sansar ek ulte ped jaisa hai — jo ismein bhi Mujhe dekh le, wahi asli samajhdar hai. Market ke utar-chadhav mein apna center mat khona."
            "Nirbhayta, satya aur shaant swabhav divine gunas hain; ahankar, krodh aur lalach demoniac gunas hain. Trading mein bhi lalach aur ahankar hi sabse bada dushman hain."
            "Jaisi jiski shraddha hoti hai, waisa hi wo ban jaata hai. Apne process mein shraddha rakh, wahi tujhe wahan le jayegi."
            "Sarva-dharman parityajya mam-ekam sharanam vraja — sab chhod ke sirf Mujhme sharan le, Main tujhe har chinta se mukt kar dunga. Apna poora bharosa rakh — Radhe Radhe."
          )

          DAY=$(date +%j)
          INDEX=$(( 10#$DAY % ${#MESSAGES[@]} ))
          MSG="${MESSAGES[$INDEX]}"

          OLD_TOKEN=$(printf '%s' "${{ secrets.BOT_TOKEN_OLD }}" | grep -oE '[0-9]+:[A-Za-z0-9_-]+' | head -n1)
          NEW_TOKEN=$(printf '%s' "${{ secrets.BOT_TOKEN_NEW }}" | grep -oE '[0-9]+:[A-Za-z0-9_-]+' | head -n1)

          curl -s -X POST "https://api.telegram.org/bot${OLD_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}"

          curl -s -X POST "https://api.telegram.org/bot${NEW_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}"
